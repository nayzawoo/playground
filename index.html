<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tools" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <meta name="theme-color" content="#0a0c12" />

    <title>Tools</title>

    <!--
      Inlined so a cold offline launch paints immediately. An external
      stylesheet here would be render-blocking, and on iOS a blank first frame
      is what makes a killed PWA look like it failed to start.
    -->
    <style>
      html,
      body {
        margin: 0;
        background-color: #0a0c12;
      }

      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #0a0c12;
      }

      #splash::after {
        content: "";
        width: 34px;
        height: 34px;
        border: 3px solid rgba(255, 255, 255, 0.14);
        border-top-color: #8b5cf6;
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      }

      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root" style="touch-action: manipulation;"></div>
    <div id="splash"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
